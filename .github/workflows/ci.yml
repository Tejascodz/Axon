name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest pyflakes fastapi httpx safetensors
      - name: Lint
        run: python -m pyflakes nyaya scripts tests
      - name: Test
        run: python -m pytest -q tests

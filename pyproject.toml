[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axon-retrieval"
version = "1.0.0"
description = "Condition-aware late-interaction re-ranking with per-condition evidence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Tejas S" }]
dependencies = ["torch>=2.6", "numpy", "pylate>=1.5"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
demo = ["gradio>=4"]
eval = ["pandas", "datasets", "transformers>=4.48", "pypdf>=5"]
dev = ["pytest", "pyflakes", "httpx"]

[project.urls]
Homepage = "https://github.com/Tejascodz/Axon"

[tool.setuptools]
packages = ["nyaya"]

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1012" viewBox="0 0 1000 1012" role="img" aria-labelledby="t d">
<title id="t">How Axon answers one question</title>
<desc id="d">A request passes authentication and limits, optional query expansion, hybrid ColBERT and BM25 search with reciprocal-rank fusion, condition-aware re-ranking, a second retrieval hop, optional LLM follow-up searches, source defences against prompt injection and planted documents, a guarded prompt, generation by an OpenAI-compatible LLM server, and answer checks, then returns the answer with cited and withheld sources. The index and the LLM server are shown at the side.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#424a53}.k{font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#59636e}
.h{font-size:20px;font-weight:700}.c{font-size:12px;fill:#59636e}.side{font-size:12.5px;fill:#424a53}
</style></defs>
<rect width="1000" height="1012" fill="#ffffff"/>
<text class="h" x="40" y="38">How one question flows through Axon</text>
<rect x="40" y="52" width="26" height="14" rx="3" fill="#eef3fd" stroke="#2457c5" stroke-width="1.5"/><text class="c" x="74" y="63">always on</text>
<rect x="160" y="52" width="26" height="14" rx="3" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 3"/><text class="c" x="194" y="63">off by default</text>
<rect x="310" y="51" width="34" height="17" rx="8.5" fill="#f3eefc" stroke="#7c4dbe" stroke-width="1.2"/><text class="c" x="327" y="63.5" text-anchor="middle" style="fill:#7c4dbe;font-weight:600">LLM</text><text class="c" x="352" y="63">calls the LLM server</text>
<rect x="40" y="92" width="640" height="58" rx="8" fill="#eef3fd" stroke="#2457c5" stroke-width="1.5"/>
<text class="t" x="56" y="115">POST /ask</text>
<text class="s" x="56" y="136">API key or tenant key · rate limit · body size cap · back-pressure (503 past the in-flight limit)</text>
<rect x="40" y="172" width="640" height="58" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="t" x="56" y="195">Query expansion</text>
<text class="s" x="56" y="216">The LLM writes what an answering document would contain; that text is searched for</text>
<text class="k" x="664" y="195" text-anchor="end">AXON_EXPAND</text>
<rect x="195.0" y="182" width="34" height="17" rx="8.5" fill="#f3eefc" stroke="#7c4dbe" stroke-width="1.2"/><text class="c" x="212.0" y="194.5" text-anchor="middle" style="fill:#7c4dbe;font-weight:600">LLM</text>
<line x1="360.0" y1="151" x2="360.0" y2="170" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="252" width="640" height="58" rx="8" fill="#eef3fd" stroke="#2457c5" stroke-width="1.5"/>
<text class="t" x="56" y="275">Hybrid first stage</text>
<text class="s" x="56" y="296">ColBERT (exact or PLAID) and BM25, 100 candidates each, tenant-filtered; rank fusion, k = 60</text>
<line x1="360.0" y1="231" x2="360.0" y2="250" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="332" width="640" height="58" rx="8" fill="#eef3fd" stroke="#2457c5" stroke-width="1.5"/>
<text class="t" x="56" y="355">Condition-aware re-rank</text>
<text class="s" x="56" y="376">Question split into conditions; MaxSim averaged per condition, then over conditions</text>
<line x1="360.0" y1="311" x2="360.0" y2="330" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="412" width="640" height="58" rx="8" fill="#eef3fd" stroke="#2457c5" stroke-width="1.5"/>
<text class="t" x="56" y="435">Second hop</text>
<text class="s" x="56" y="456">Documents whose titles appear in the top 2 passages; the best 2 take reserved places in the top k</text>
<text class="k" x="664" y="435" text-anchor="end">AXON_HOPS=2</text>
<line x1="360.0" y1="391" x2="360.0" y2="410" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="492" width="640" height="58" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="t" x="56" y="515">Follow-up searches</text>
<text class="s" x="56" y="536">The LLM names the missing fact as a new query, up to 2 times; new passages take reserved places</text>
<text class="k" x="664" y="515" text-anchor="end">AXON_FOLLOW_UPS</text>
<rect x="220.79999999999998" y="502" width="34" height="17" rx="8.5" fill="#f3eefc" stroke="#7c4dbe" stroke-width="1.2"/><text class="c" x="237.79999999999998" y="514.5" text-anchor="middle" style="fill:#7c4dbe;font-weight:600">LLM</text>
<line x1="360.0" y1="471" x2="360.0" y2="490" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="572" width="640" height="58" rx="8" fill="#eef3fd" stroke="#2457c5" stroke-width="1.5"/>
<text class="t" x="56" y="595">Source defences</text>
<text class="s" x="56" y="616">Injection scanner and classifier withhold passages; echo filter drops ones restating the question</text>
<line x1="360.0" y1="551" x2="360.0" y2="570" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="652" width="640" height="58" rx="8" fill="#eef3fd" stroke="#2457c5" stroke-width="1.5"/>
<text class="t" x="56" y="675">Guarded prompt</text>
<text class="s" x="56" y="696">Sources escaped inside &lt;source&gt; tags and marked as data; per-condition evidence attached</text>
<line x1="360.0" y1="631" x2="360.0" y2="650" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="732" width="640" height="58" rx="8" fill="#eef3fd" stroke="#2457c5" stroke-width="1.5"/>
<text class="t" x="56" y="755">Generation</text>
<text class="s" x="56" y="776">Any OpenAI-compatible server (SGLang, vLLM); streamed, retried with backoff, behind a circuit breaker</text>
<rect x="152.0" y="742" width="34" height="17" rx="8.5" fill="#f3eefc" stroke="#7c4dbe" stroke-width="1.2"/><text class="c" x="169.0" y="754.5" text-anchor="middle" style="fill:#7c4dbe;font-weight:600">LLM</text>
<line x1="680" y1="761.0" x2="718" y2="761.0" stroke="#7c4dbe" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="360.0" y1="711" x2="360.0" y2="730" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="812" width="640" height="58" rx="8" fill="#eef3fd" stroke="#2457c5" stroke-width="1.5"/>
<text class="t" x="56" y="835">Answer checks</text>
<text class="s" x="56" y="856">Citations to unseen sources removed; an uncited answer is withheld; optional claim-by-claim check</text>
<text class="k" x="664" y="835" text-anchor="end">AXON_VERIFY</text>
<line x1="360.0" y1="791" x2="360.0" y2="810" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="892" width="640" height="58" rx="8" fill="#eef3fd" stroke="#2457c5" stroke-width="1.5"/>
<text class="t" x="56" y="915">Response</text>
<text class="s" x="56" y="936">Answer, the sources it cites, and each withheld passage with the reason</text>
<line x1="360.0" y1="871" x2="360.0" y2="890" stroke="#59636e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="720" y="652" width="240" height="298" rx="10" fill="#f3eefc" stroke="#7c4dbe" stroke-width="1.3"/>
<text class="t" x="738" y="682">LLM server</text>
<text class="side" x="738" y="701"></text>
<text class="side" x="738" y="720">OpenAI-compatible: SGLang or</text>
<text class="side" x="738" y="739">vLLM (deploy/), or a hosted</text>
<text class="side" x="738" y="758">endpoint. Measured with</text>
<text class="side" x="738" y="777">Qwen3-4B-Instruct on a T4.</text>
<text class="side" x="738" y="796">Never follows redirects;</text>
<text class="side" x="738" y="815">replies are size-capped.</text>
<rect x="720" y="252" width="240" height="298" rx="10" fill="#f6f8fa" stroke="#59636e" stroke-width="1.3"/>
<text class="t" x="738" y="282">Index (one folder)</text>
<text class="side" x="738" y="301"></text>
<text class="side" x="738" y="320">ColBERT token vectors, fp16,</text>
<text class="side" x="738" y="339">memory-mapped; BM25; optional</text>
<text class="side" x="738" y="358">PLAID for large collections.</text>
<text class="side" x="738" y="377"></text>
<text class="side" x="738" y="396">Incremental update and</text>
<text class="side" x="738" y="415">compaction; versioned atomic</text>
<text class="side" x="738" y="434">commits, reloaded live.</text>
<text class="side" x="738" y="453">Records model and commit.</text>
<line x1="720" y1="281.0" x2="683" y2="281.0" stroke="#59636e" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
<line x1="720" y1="361.0" x2="683" y2="361.0" stroke="#59636e" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
<line x1="720" y1="441.0" x2="683" y2="441.0" stroke="#59636e" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
<line x1="720" y1="521.0" x2="683" y2="521.0" stroke="#59636e" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
</svg>
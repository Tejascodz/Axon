global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: axon
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/axon_metrics_key    # the metrics-only key: cannot call /ask or /rerank
    static_configs: [{targets: ["axon:8080"]}]

  - job_name: llm                                         # vLLM (vllm:*) or SGLang (sglang:*) server metrics
    metrics_path: /metrics
    static_configs: [{targets: ["llm:8000"]}]

  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

# Add an `alerting:` block pointing at your Alertmanager to deliver alerts (pager, Slack, email).
